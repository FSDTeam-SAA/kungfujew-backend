services:

  backend:
    container_name: kungfujew_backend
    image: kungfujew-backend:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin}@mongodb:27017/${MONGO_INITDB_DATABASE:-kungfujew}?authSource=admin&replicaSet=rs0
      DATABASE_HOST: mongodb
      DATABASE_PORT: 27017
      NODE_ENV: ${NODE_ENV}
      PORT: 5000

      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis-stack:
        condition: service_healthy
    networks:
      - blog_network
